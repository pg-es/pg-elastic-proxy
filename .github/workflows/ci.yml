name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: mise run build

  vet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: mise run validate:vet

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg: [14, 15, 16, 17, 18]
    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ""
          POSTGRES_DB: testdb
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d testdb"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: mise run test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: mise run validate:lint

  deadcode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: mise run validate:deadcode

  # Non-blocking progress tracker. continue-on-error: true is intentional —
  # compat failures never block merges. Pass rate increases as plans implement features.
  # To update the skiplist, edit test/compat/skiplist.yaml in the implementing plan's PR.
  compat:
    name: ES Compatibility (${{ matrix.backend }})
    runs-on: ubuntu-latest
    needs: [test]
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: postgres-14
            image: postgres:14
          - backend: postgres-15
            image: postgres:15
          - backend: postgres-16
            image: postgres:16
          - backend: postgres-17
            image: postgres:17
          - backend: postgres-18
            image: postgres:18
          - backend: paradedb
            image: paradedb/paradedb:latest
    services:
      postgres:
        image: ${{ matrix.image }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ""
          POSTGRES_DB: testdb
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d testdb"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: jdx/mise-action@v2
      - name: Start pg-es-proxy
        run: |
          mise run dev &
          for _ in $(seq 1 30); do
            curl -sf http://localhost:9200/ && break
            sleep 1
          done
      - name: Run ES compat tests
        id: compat
        shell: bash
        run: |
          set -o pipefail
          mise run compat:run | tee /tmp/compat-output.txt
      - name: Extract pass rate
        if: always()
        run: |
          grep -oP 'COMPAT: \K\d+/\d+' /tmp/compat-output.txt \
            > /tmp/compat-pass-rate.txt || echo "0/0" > /tmp/compat-pass-rate.txt
      - name: Upload pass rate artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compat-pass-rate-${{ matrix.backend }}
          path: /tmp/compat-pass-rate.txt
          overwrite: true
      - name: Post pass-rate summary
        if: always()
        run: |
          SUMMARY=$(cat /tmp/compat-pass-rate.txt)
          {
            echo "## ES Compatibility (${{ matrix.backend }})"
            echo ""
            echo "| Backend | Pass Rate |"
            echo "|---------|-----------|"
            echo "| ${{ matrix.backend }} | $SUMMARY |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Find base ref run
        id: find-base-run
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          RUN_ID=$(gh api \
            "/repos/${{ github.repository }}/actions/workflows/ci.yml/runs?branch=${{ github.base_ref }}&per_page=10" \
            --jq '[.workflow_runs[] | select(.conclusion != null)][0].id // empty')
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Download base pass rate
        id: base-artifact
        if: always() && github.event_name == 'pull_request' && steps.find-base-run.outputs.run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: compat-pass-rate-${{ matrix.backend }}
          run-id: ${{ steps.find-base-run.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/base-rate
      - name: Post pass-rate diff
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          CURRENT=$(cat /tmp/compat-pass-rate.txt)
          current_passed=$(echo "$CURRENT" | cut -d/ -f1)
          current_total=$(echo "$CURRENT" | cut -d/ -f2)
          BASE_FILE="/tmp/base-rate/compat-pass-rate.txt"
          if [ -f "$BASE_FILE" ] && [ "${current_total:-0}" -gt 0 ]; then
            BASE=$(cat "$BASE_FILE")
            base_passed=$(echo "$BASE" | cut -d/ -f1)
            base_total=$(echo "$BASE" | cut -d/ -f2)
            if [ "${base_total:-0}" -gt 0 ]; then
              current_pct=$((current_passed * 100 / current_total))
              base_pct=$((base_passed * 100 / base_total))
              diff=$((current_pct - base_pct))
              sign="+"
              [ "$diff" -lt 0 ] && sign=""
              BODY="**ES Compat [${{ matrix.backend }}]**: ${sign}${diff}% vs \`${{ github.base_ref }}\` (${base_pct}% → ${current_pct}%, ${CURRENT} passed)"
            else
              BODY="**ES Compat [${{ matrix.backend }}]**: ${CURRENT} passed (no base rate for comparison)"
            fi
          else
            BODY="**ES Compat [${{ matrix.backend }}]**: ${CURRENT} passed (no base ref data)"
          fi
          gh pr comment "${{ github.event.pull_request.number }}" --body "$BODY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
