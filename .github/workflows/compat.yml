name: ES Compatibility

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  # Non-blocking progress tracker. continue-on-error: true is intentional —
  # compat failures never block merges. Pass rate increases as plans implement features.
  # To update the skiplist, edit test/compat/skiplist.yaml in the implementing plan's PR.
  compat:
    name: ES Compatibility (${{ matrix.backend }} / ES ${{ matrix.es_version }})
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      actions: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: postgres-18
            image: postgres:18
            es_version: "8.19"
            es_branch: "8.19"
            es_flavour: es8
          - backend: postgres-18
            image: postgres:18
            es_version: "9.x"
            es_branch: "main"
            es_flavour: es9
          - backend: paradedb-18
            image: paradedb/paradedb:latest
            es_version: "8.19"
            es_branch: "8.19"
            es_flavour: es8
          - backend: paradedb-18
            image: paradedb/paradedb:latest
            es_version: "9.x"
            es_branch: "main"
            es_flavour: es9
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: jdx/mise-action@v2
      - name: Start postgres
        uses: ./.github/actions/compose
        env:
          POSTGRES_IMAGE: ${{ matrix.image }}
        with:
          services: postgres
      - name: Checkout ES version
        run: |
          git -C test/compat/testdata fetch origin ${{ matrix.es_branch }}
          git -C test/compat/testdata checkout --force FETCH_HEAD
      - name: Start pg-es-proxy
        run: |
          mise run dev &
          for _ in $(seq 1 30); do
            curl -sf http://localhost:9200/ && break
            sleep 1
          done
      - name: Run ES compat tests
        id: compat
        shell: bash
        env:
          COMPAT_FLAVOUR: ${{ matrix.es_flavour }}
        run: |
          set -o pipefail
          mise run compat:run | tee /tmp/compat-output.txt
      - name: Extract pass rate
        if: always()
        run: |
          total=$(grep -oP 'compat: total=\K\d+' /tmp/compat-output.txt || echo 0)
          passed=$(grep -oP 'compat: total=\d+ passed=\K\d+' /tmp/compat-output.txt || echo 0)
          echo "${passed}/${total}" > /tmp/compat-pass-rate.txt
      - name: Upload pass rate artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compat-pass-rate-${{ matrix.backend }}-es${{ matrix.es_version }}
          path: /tmp/compat-pass-rate.txt
          overwrite: true
      - name: Post pass-rate summary
        if: always()
        run: |
          SUMMARY=$(cat /tmp/compat-pass-rate.txt)
          {
            echo "## ES Compatibility (${{ matrix.backend }} / ES ${{ matrix.es_version }})"
            echo ""
            echo "| Backend | ES Version | Pass Rate |"
            echo "|---------|------------|-----------|"
            echo "| ${{ matrix.backend }} | ${{ matrix.es_version }} | $SUMMARY |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Find base ref run
        id: find-base-run
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_REF: ${{ github.base_ref }}
          REPO: ${{ github.repository }}
        run: |
          RUN_ID=$(gh api "/repos/${REPO}/actions/workflows/compat.yml/runs" \
            -f branch="$BASE_REF" -f event=push -f per_page=10 \
            --jq '[.workflow_runs[] | select(.conclusion != null)][0].id // empty')
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
      - name: Download base pass rate
        id: base-artifact
        if: always() && github.event_name == 'pull_request' && steps.find-base-run.outputs.run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: compat-pass-rate-${{ matrix.backend }}-es${{ matrix.es_version }}
          run-id: ${{ steps.find-base-run.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/base-rate
      - name: Post pass-rate diff
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_REF: ${{ github.base_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # The artifact is untrusted: only digits/slash are allowed before it
          # reaches arithmetic, which would otherwise evaluate embedded commands.
          CURRENT=$(cat /tmp/compat-pass-rate.txt 2>/dev/null)
          [[ "$CURRENT" =~ ^[0-9]+/[0-9]+$ ]] || CURRENT="0/0"
          current_passed=${CURRENT%%/*}
          current_total=${CURRENT##*/}
          BASE_FILE="/tmp/base-rate/compat-pass-rate.txt"
          BASE=""
          [ -f "$BASE_FILE" ] && BASE=$(cat "$BASE_FILE")
          [[ "$BASE" =~ ^[0-9]+/[0-9]+$ ]] || BASE=""
          if [ -n "$BASE" ] && [ "$current_total" -gt 0 ]; then
            base_passed=${BASE%%/*}
            base_total=${BASE##*/}
            if [ "$base_total" -gt 0 ]; then
              current_pct=$((current_passed * 100 / current_total))
              base_pct=$((base_passed * 100 / base_total))
              diff=$((current_pct - base_pct))
              sign="+"
              [ "$diff" -lt 0 ] && sign=""
              BODY="**ES Compat [${{ matrix.backend }} / ES ${{ matrix.es_version }}]**: ${sign}${diff}% vs \`${BASE_REF}\` (${base_pct}% -> ${current_pct}%, ${CURRENT} passed)"
            else
              BODY="**ES Compat [${{ matrix.backend }} / ES ${{ matrix.es_version }}]**: ${CURRENT} passed (no base rate for comparison)"
            fi
          else
            BODY="**ES Compat [${{ matrix.backend }} / ES ${{ matrix.es_version }}]**: ${CURRENT} passed (no base ref data)"
          fi
          gh pr comment "$PR_NUMBER" --body "$BODY"
