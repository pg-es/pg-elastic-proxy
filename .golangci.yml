version: "2"

linters:
  default: standard
  enable:
    - asciicheck
    - bidichk
    - bodyclose
    - containedctx
    - copyloopvar
    - cyclop
    - dupl
    - dupword
    - durationcheck
    - embeddedstructfieldcheck
    - err113
    - errorlint
    - errname
    - exhaustive
    - exptostd
    - fatcontext
    - forcetypeassert
    - funcorder
    - funlen
    - gochecknoglobals
    - gochecknoinits
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godoclint
    - godot
    - gosec
    - iface
    - importas
    - intrange
    - iotamixing
    - lll
    - loggercheck
    - makezero
    - mirror
    - misspell
    - mnd
    - modernize
    - nakedret
    - nestif
    - nilerr
    - noctx
    - noinlineerr
    - nolintlint
    - paralleltest
    - perfsprint
    - prealloc
    - predeclared
    - reassign
    - recvcheck
    - revive
    - rowserrcheck
    - sloglint
    - sqlclosecheck
    - testifylint
    - testpackage
    - thelper
    - unconvert
    - unparam
    - unqueryvet
    - unused
    - usestdlibvars
    - usetesting
    - varnamelen
    - wastedassign
    - whitespace
    - wrapcheck
    - wsl_v5
    - zerologlint
  settings:
    cyclop:
      max-complexity: 15
    dupl:
      threshold: 150
    funlen:
      lines: 80
      statements: 50
    gocognit:
      min-complexity: 20
    gocyclo:
      min-complexity: 15
    exhaustive:
      default-signifies-exhaustive: true
    lll:
      line-length: 160
    mnd:
      ignored-functions:
        - strconv.FormatInt
        - strconv.FormatUint
        - strconv.FormatFloat
        - strconv.ParseInt
        - strconv.ParseUint
        - strconv.ParseFloat
    nakedret:
      max-func-lines: 30
    nolintlint:
      require-specific: true
      require-explanation: true
    gocritic:
      enabled-tags:
        - diagnostic
        - experimental
        - opinionated
        - performance
        - style
    varnamelen:
      min-name-length: 2
      ignore-decls:
        - w http.ResponseWriter
        - r *http.Request
    wrapcheck:
      ignore-package-globs:
        - github.com/pg-es/pg-es-proxy/*
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
        - name: increment-decrement
        - name: indent-error-flow
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: unused-parameter
        - name: var-declaration
        - name: var-naming

formatters:
  enable:
    - gofumpt
    - goimports
